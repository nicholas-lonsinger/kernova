// Kernova guest <-> host wire protocol.
//
// All traffic on a vsock connection is a sequence of length-prefixed Frame
// messages. Each Frame carries exactly one payload selected by the `payload`
// oneof. Field numbers and existing payload types must never be reused; new
// services append new payload types at the next available number.
syntax = "proto3";

package kernova.v1;

// A single message on the wire. The `payload` oneof selects the message type.
//
// Wire layout: a 4-byte big-endian uint32 length prefix (NOT included in the
// length count itself) followed by `length` bytes of the encoded Frame.
message Frame {
  // Protocol version. Bumped when the framing or required fields change in a
  // backwards-incompatible way. Currently 1.
  uint32 protocol_version = 1;

  // 22 was `ClipboardData`, the legacy single-frame clipboard data path
  // (whole payload in one frame). Retired in favour of streaming the payload.
  // Never reuse — reserved for wire history.
  reserved 22;

  // 24..28 were `ClipboardStreamBegin`, `ClipboardChunk`, `ClipboardStreamEnd`,
  // `ClipboardStreamAck` and `ClipboardStreamAbort`, the chunk-streamed
  // clipboard payload protocol: the control channel carried the bytes as
  // framed chunks under an application-level credit window. Retired with it —
  // a payload now rides its own data connection (50..59), where the kernel's
  // socket buffers are the flow control. Never reuse — reserved for wire
  // history.
  reserved 24, 25, 26, 27, 28;

  // 29 was `ClipboardTreeFetch`, which pulled a directory representation's
  // placeholder tree one node at a time (a listing, or one child file).
  // Retired with the File Provider placeholder mechanism it fed: a directory
  // rep now rides the plain-file stream path as a request-time archive.
  reserved 29;

  oneof payload {
    Hello hello = 10;
    Error error = 11;
    Heartbeat heartbeat = 12;

    // Service payloads occupy reserved number ranges so each service can grow
    // independently without colliding:
    //   12..19 reserved for control plane (heartbeat, policy, future control)
    //   20..29 reserved for clipboard
    //   30..39 reserved for logging
    //   40..49 reserved for drag/drop
    //   50..59 reserved for the clipboard data connection
    PolicyUpdate policy_update = 13;

    ClipboardOffer clipboard_offer = 20;
    ClipboardRequest clipboard_request = 21;

    // 22 retired (see `reserved` above).

    ClipboardRelease clipboard_release = 23;

    // 24..28 retired (see `reserved` above).
    // 29 retired (see `reserved` above).

    LogRecord log_record = 30;

    DropOffer drop_offer = 40;
    DropComplete drop_complete = 41;
    DropRelease drop_release = 42;

    // 50..59: the clipboard data connection. One guest-initiated vsock
    // connection per transfer carries these two frames as its header, then the
    // payload bytes, then a fixed 33-byte trailer, then EOF.
    ClipboardTransferRequest clipboard_transfer_request = 50;
    ClipboardTransferReply clipboard_transfer_reply = 51;
  }
}

// Sent by both sides immediately after a vsock connection is accepted.
//
// Each side advertises its protocol version, the capabilities it supports,
// and identifying information for diagnostics. `KernovaCapability` owns the
// tag list both sides advertise and recognize.
message Hello {
  // Bumps when the service-level protocol changes within a given
  // `protocol_version`. Independent from `Frame.protocol_version`.
  uint32 service_version = 1;

  // Capability tags advertised by the sender. Receivers ignore unknown tags.
  repeated string capabilities = 2;

  // Optional identifying info. Diagnostic only; not used for routing.
  AgentInfo agent_info = 3;

  // The guest-agent version the *host* currently bundles, sent host->guest so
  // the guest can show its own update state ("up to date" / "update available")
  // in its menu-bar UI. Populated only by the host's control service; the
  // guest leaves it empty in its own Hello. Empty when unknown (e.g. a host
  // predating this field, or its version sidecar is missing) — the guest must
  // treat empty as "no update info" and never render an update prompt from it.
  string bundled_agent_version = 4;
}

// Identifying info about the peer. All fields are optional — populate what's
// useful, leave the rest empty.
message AgentInfo {
  string os = 1;             // e.g. "macOS", "Linux"
  string os_version = 2;     // e.g. "26.0", "6.8.0"
  string agent_version = 3;  // e.g. "0.1.0"
}

// One unit of log output forwarded from a guest agent to the host.
//
// The guest formats the message text locally so all privacy decisions stay on
// the guest side; the host treats `message` as opaque and republishes it via
// its own logger. Levels map directly onto Apple's `os.Logger` log levels so
// the host can pass them through with the same severity semantics.
message LogRecord {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_DEBUG = 1;
    LEVEL_INFO = 2;
    LEVEL_NOTICE = 3;
    LEVEL_WARNING = 4;
    LEVEL_ERROR = 5;
    LEVEL_FAULT = 6;
  }

  // Wall-clock time at which the record was emitted on the guest, expressed
  // as milliseconds since the Unix epoch in UTC. Hosts may apply their own
  // clock-skew correction; the field is intended for chronological ordering
  // and post-mortem analysis, not strict synchronisation.
  int64 timestamp_ms = 1;

  Level level = 2;

  // Logger subsystem and category from the guest, e.g. "app.kernova.macosagent" /
  // "VsockGuestClipboardAgent". Treated as opaque labels by the host.
  string subsystem = 3;
  string category = 4;

  // Pre-formatted message text. Must be valid UTF-8.
  string message = 5;
}

// Per-representation metadata advertised in a `ClipboardOffer`. Carries no
// bytes — it lets the receiver register lazy promises, render a preview, and
// pre-decide disk needs before pulling any data.
message ClipboardRepresentationInfo {
  string uti = 1;  // e.g. "public.utf8-plain-text", "public.png"

  // Size of the representation's bytes. For a copied file this is the file's
  // size from a stat — the bytes themselves are never read to build the offer.
  // For a directory rep (`is_directory`) it is the producer's stat-walk size
  // ESTIMATE of the *uncompressed* source tree, which is what a streamed
  // extract writes. The receiver's paste cap, free-space pre-flight and
  // extract ceiling all gate on it; the transport re-enforces reality with
  // `max_accept_byte_count` on the request, the extract's own output guard,
  // and the trailer's SHA-256 over every payload byte.
  uint64 byte_count = 2;

  // Suggested filename when this representation is a file payload (e.g. a
  // copied image file → "photo.png"). Empty means inline-only: the receiver
  // reassembles the bytes in memory and renders them but does not materialize
  // a file. When set, the receiver streams the bytes to a local temp file and
  // offers its file URL so a Finder paste creates the file. Each non-empty
  // filename is a distinct file, so a multi-file copy carries several. Folded
  // into the content digest (it round-trips identically across the wire) so two
  // files that share bytes+UTI but differ only by name are distinguishable —
  // the file *path* is still never hashed.
  string filename = 3;

  // Whether this representation should be placed inline on the pasteboard
  // (text/RTF/inline image) versus materialized as a file. Mirrors the
  // sender's inline-vs-file decision so the receiver chooses its sink (RAM vs
  // temp file) without re-deriving the rule.
  bool is_inline = 4;

  // Whether this file representation is a *directory* (folder, or an OS
  // package such as .app/.rtfd). Implies a non-empty `filename` (the folder
  // name, without an archive suffix) and `is_inline = false`.
  //
  // A directory rep streams as an archive of its tree — the same
  // `ClipboardTransferReply.is_archive` encoding every file representation
  // uses — encoded straight onto the wire when the representation is
  // *requested*, never at copy time and never through an archive file, and
  // extracted by the receiver straight into a real directory. What this flag
  // adds is that the receiver extracts into a folder of `filename`'s name
  // rather than delivering the archive's single file entry, and that
  // `byte_count` is an estimate.
  //
  // The transport is offer-agnostic: the requester tells its own receiver that
  // a transfer carries a directory when it registers the pull, so nothing on
  // the wire repeats this flag. Excluded from the content digest
  // — the archive's SHA-256 and the folded filename already identify it.
  bool is_directory = 5;
}

// Sent by either side to advertise that fresh clipboard content is available.
// Metadata only — never carries bytes. The receiver registers lazy promises
// from `rep_info` and pulls the bytes of each representation it actually
// consumes over that transfer's own data connection.
//
// The `generation` field is a monotonically increasing counter scoped to the
// sender. Each new offer bumps it; receivers use it to discard requests that
// race a newer offer.
message ClipboardOffer {
  uint64 generation = 1;

  // 2 was `repeated ClipboardFormat formats` (the legacy text-only format
  // enum); 3 was `repeated string utis` (a bare UTI list, superseded by the
  // richer `rep_info`). Both retired — never reuse.
  reserved 2, 3;
  reserved "formats", "utis";

  // Metadata for every available representation, richest first.
  repeated ClipboardRepresentationInfo rep_info = 4;

  // Whether the source pasteboard marked this snapshot confidential
  // (org.nspasteboard.ConcealedType — the convention password managers use).
  // The content is still offered so it can be pasted into the peer; the
  // receiver hides it behind a placeholder in its clipboard window rather than
  // rendering the secret. Snapshot-level, not per-representation.
  bool is_concealed = 5;
}

// Sent in response to a `ClipboardOffer` to pull one representation's bytes,
// by the side that cannot dial — the host, which only ever accepts vsock
// connections. The OS asks the pasteboard per type, so a paste pulls only the
// representation actually read; the requester sends one `ClipboardRequest` per
// representation it consumes. The responder answers by dialling that
// transfer's data connection and writing a `ClipboardTransferReply` naming
// this `transfer_id`. A guest pulls with a `ClipboardTransferRequest` on the
// connection instead, so this frame only ever travels host→guest.
message ClipboardRequest {
  // Echoes the offer's generation so a request racing a newer offer is dropped.
  uint64 generation = 1;

  // 2 was the legacy `ClipboardFormat format`; 3 was `repeated string utis`
  // (the requester echoed the whole offer's UTI list). Both retired — a
  // request now names exactly one representation via `uti`. Never reuse.
  reserved 2, 3;
  reserved "format", "utis";

  // Names the transfer answering this request, which is how the data
  // connection carrying it is matched to the pull awaiting it.
  // `transfer_id = (generation << 16) | repIndex`, scoped per connection.
  uint64 transfer_id = 4;

  // The single representation being consumed (one of the offer's `rep_info`
  // UTIs).
  string uti = 5;

  // The requester's free-space ceiling for this transfer: the responder must
  // abort (`disk.full`) rather than start a transfer the requester cannot
  // stage. 0 means "no ceiling advertised".
  uint64 max_accept_byte_count = 6;
}

// Sent by the offerer when an offer is no longer valid (e.g. the user copied
// new content before the receiver requested the old). Receivers should drop
// any pending state for the named generation.
message ClipboardRelease {
  uint64 generation = 1;
}

// The first frame on a data connection when the side that dialled is the one
// RECEIVING the payload (a guest paste, a drop into the guest): the connection
// itself is the request, so no `ClipboardRequest` crosses the control channel
// in that direction. Same fields as `ClipboardRequest`.
message ClipboardTransferRequest {
  // Echoes the offer's generation so a request racing a newer offer is dropped.
  uint64 generation = 1;

  // Names the transfer, derived exactly as `ClipboardRequest.transfer_id` is.
  uint64 transfer_id = 2;

  // The single representation being consumed (one of the offer's `rep_info`
  // UTIs).
  string uti = 3;

  // The requester's free-space ceiling for this transfer: the sender refuses
  // (`disk.full`) rather than start a transfer the requester cannot stage.
  uint64 max_accept_byte_count = 4;
}

// Written on a data connection by whichever side SENDS the payload, before its
// first payload byte: by the answering side after it reads a
// `ClipboardTransferRequest`, or as the connection's first frame when the
// dialling side is answering a `ClipboardRequest` it received on the control
// channel.
message ClipboardTransferReply {
  // The transfer being answered — the request's `transfer_id`, which is how
  // the receiving side matches the connection to the pull awaiting it.
  uint64 transfer_id = 1;

  // Non-empty when the transfer will not happen: no payload bytes and no
  // trailer follow, and the connection closes. The vocabulary is
  // `ClipboardStreamAbortCode` (`request.stale`, `request.range`,
  // `request.uti`, `request.cancelled`, `superseded`, `disk.full`).
  string refusal_code = 2;

  // Human-readable detail for logs / user-facing messages; empty when
  // `refusal_code` is.
  string refusal_message = 3;

  // Whether the payload is an AppleArchive (LZ4) the receiver extracts, rather
  // than the representation's own bytes. Every representation that lands on
  // the receiver's disk crosses as an archive — a file as a one-entry archive,
  // a folder as an archive of its tree, and an inline representation larger
  // than `ClipboardStreamTuning.maxResidentInlineBytes`, which the receiver
  // extracts and maps back into memory. Only an inline representation at or
  // below that size crosses raw, reassembled in RAM.
  bool is_archive = 4;

  // Whether the receiver delivers the payload as pasteboard bytes (inline) or
  // as a file. Mirrors `ClipboardRepresentationInfo.is_inline`.
  bool is_inline = 5;

  // Payload size in bytes for a raw payload, which the receiver bounds the
  // arriving bytes by. 0 for an archive (`is_archive`), whose compressed size
  // is only known once it has been produced: the offer's `byte_count`, which
  // the requester already read, stands in for the receiver's pre-flight and
  // extract ceiling.
  uint64 total_bytes = 6;
}

// Liveness ping exchanged on the control channel. Each side sends one on a
// recurring timer (default ~5 seconds). Receivers refresh their "last seen"
// clock for the peer and treat extended silence as the peer being hung —
// distinct from a clean socket disconnect.
//
// `nonce` is opaque. Receivers do not echo it; both sides emit independent
// streams of heartbeats. The field is reserved for future use (e.g. RTT
// sampling) without bumping `Frame.protocol_version`.
message Heartbeat {
  uint64 nonce = 1;
}

// Sent by the host on the control channel to tell the guest agent which
// optional capabilities are currently enabled for this VM. The guest agent
// uses it to actually stop work for disabled capabilities (close channels,
// stop pasteboard polling, drop buffered records) rather than just having
// the host ignore inbound traffic.
//
// The host sends one `PolicyUpdate` immediately after the control-plane
// `Hello` exchange and one each time the user toggles a capability while
// the VM is running. Each message carries the full current policy snapshot;
// receivers compare against their last applied state and act on diffs.
message PolicyUpdate {
  // Whether the guest's log-forwarding agent should connect on the log port
  // and stream `LogRecord` frames to the host.
  bool log_forwarding_enabled = 1;

  // Whether the guest's clipboard agent should poll `NSPasteboard.general`,
  // exchange `ClipboardOffer`/`ClipboardRequest` with the host on the
  // clipboard port, and dial the clipboard data port per transfer.
  bool clipboard_sharing_enabled = 2;

  // Ceiling on the total of one paste's file representations, in bytes. Both
  // ends enforce it against their own inbound pastes, so the host pushes its
  // value here rather than letting the two sides hold separate figures.
  //
  // `0` means unset — the receiver uses its own built-in default.
  uint64 clipboard_max_paste_bytes = 3;

  // Whether the guest's drop agent should dial the drop port and take
  // `DropOffer` frames. The host binds the drop and drop-data ports only
  // while this is set, so a guest that dials anyway is refused every retry
  // interval for as long as the setting is off.
  bool drop_files_enabled = 4;
}

// Reported by either side when a request cannot be fulfilled, or as an
// asynchronous notification of a problem (e.g. malformed request, capability
// mismatch). The receiver may log and continue; it should not assume the
// peer is gone.
message Error {
  // Stable machine-readable code, e.g. "version.unsupported",
  // "format.unavailable", "transfer.too.large".
  string code = 1;

  // Human-readable detail. May be shown in logs or surfaced to the user.
  string message = 2;

  // Optional reference to the message type this error replies to,
  // e.g. "clipboard.request". Populated when the error is causally linked
  // to a specific incoming message.
  optional string in_reply_to = 3;
}

// Host->guest: the files of one drag-and-drop gesture onto the VM display.
//
// Metadata only, exactly like `ClipboardOffer`: the guest pulls each
// representation over its own data connection on the drop data port, through
// the same `ClipboardTransferRequest`/`Reply` path a paste uses. Every
// representation carries a non-empty `filename`, and the guest writes each into
// its Downloads folder as a file — `is_inline` is meaningless here and is
// ignored, since a drop never reaches a pasteboard.
message DropOffer {
  // Per-connection counter, starting at 1. Each drop gesture is an independent
  // job under its own generation; a second drop does not supersede the first.
  uint64 generation = 1;

  // Metadata for each dropped item, in the order the drop delivered them.
  repeated ClipboardRepresentationInfo rep_info = 2;
}

// Guest->host: the drop job for `generation` has finished.
message DropComplete {
  uint64 generation = 1;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Every representation landed in the guest's Downloads folder.
    OUTCOME_COMPLETED = 1;
    // Cancelled from either side. Files already landed are kept; the in-flight
    // partial is deleted by the stream layer's abort path.
    OUTCOME_CANCELLED = 2;
    // The drop could not be completed — see `code`.
    OUTCOME_FAILED = 3;
  }
  Outcome outcome = 2;

  // Stable machine-readable code for `OUTCOME_FAILED`, from
  // `ClipboardErrorCode` (e.g. "clipboard.drop.disk.full"); empty otherwise.
  // The host renders its own sentence from this rather than from `message`.
  string code = 3;

  // Human-readable detail for logs. Never rendered in host UI.
  string message = 4;
}

// Host->guest: the host abandons the drop for `generation` (the user cancelled,
// or the session is going away). The guest aborts the in-flight pull, drops the
// representations it has not requested yet, keeps whatever already landed in
// Downloads, and replies `DropComplete{OUTCOME_CANCELLED}`.
message DropRelease {
  uint64 generation = 1;
}
