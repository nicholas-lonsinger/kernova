name: Select Xcode
description: >-
  Select the image's newest Xcode and export its build number as XCODE_BUILD.
  AccessoryAccess and VZUSBPassthroughDeviceConfiguration are macOS 27 SDK APIs
  an Xcode 26 toolchain cannot resolve at all, so every job runs on `xcode-27`,
  the only image carrying one. That image is a preview, so a run can sit queued
  for a while before a runner picks it up.

runs:
  using: composite
  steps:
    # The image carries one Xcode and an Xcode.app symlink to it, so taking the
    # newest resolves to that toolchain either way — and stays right on an image
    # that gains a second. The inventory and SDK version are printed because a
    # toolchain too old to carry the SDK otherwise surfaces as a bare "unable to
    # resolve module dependency" naming no Xcode at all. `xcodebuild -version`
    # doubles as the full-Xcode assert, and names the toolchain whose bundled
    # swift-format decides a lint run — `swift-format --version` reports `main`.
    - shell: bash
      run: |
        ls -d /Applications/Xcode*.app
        newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
        sudo xcode-select -s "$newest/Contents/Developer"
        xcodebuild -version
        xcrun --show-sdk-version
        swift --version
        echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"
