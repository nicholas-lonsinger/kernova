name: Portable Targets

# Tests on Windows the KernovaKit targets its manifest declares off macOS,
# with the swift.org release `.swift-version` pins. Linux tests them in
# xcodebuild-test.yml, whose attestation covers them.
on:
  push:
    branches: [main]
    paths: &inputs
      - '.github/workflows/portable.yml'
      - '.swift-version'
      - 'Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
      - 'KernovaKit/**'
      - 'Tools/lib/package-pins.sh'
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push supersedes its older run; every other run owns
# its commit's group, so no main commit's run is cancelled or dropped while
# pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows (arm64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # swift.org's own installer. It records PATH and SDKROOT in the
      # registry, which a later step's environment is not rebuilt from, so the
      # values it set are handed on through GITHUB_PATH and GITHUB_ENV.
      - name: Install Swift
        shell: pwsh
        run: |
          $version = (Get-Content -Raw .swift-version).Trim()
          $release = "swift-$version-RELEASE"
          $url = "https://download.swift.org/swift-$version-release/windows10-arm64/$release/$release-windows10-arm64.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The Swift installer exited $($process.ExitCode)" }

          $before = $env:Path -split ';'
          foreach ($scope in 'Machine', 'User') {
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($path) {
              $path -split ';' | Where-Object { $_ -and ($before -notcontains $_) } | ForEach-Object {
                Add-Content -Path $env:GITHUB_PATH -Value $_
              }
            }
            $sdkRoot = [Environment]::GetEnvironmentVariable('SDKROOT', $scope)
            if ($sdkRoot) { Add-Content -Path $env:GITHUB_ENV -Value "SDKROOT=$sdkRoot" }
          }

      # Git for Windows' bash, so the tests take their pins the way every
      # other platform does.
      - name: Test
        shell: bash
        run: . Tools/lib/package-pins.sh && with_package_pins KernovaKit swift test --
