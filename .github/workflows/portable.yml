name: Portable Targets

# Builds and tests the KernovaKit targets its manifest declares off macOS, on
# Linux and on Windows, with the swift.org release `.swift-version` pins.
on:
  push:
    branches: [main]
    paths:
      - 'KernovaKit/**'
      - '.github/workflows/**'
      - '.swift-version'
      - 'Tools/lib/package-pins.sh'
      - 'Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
  pull_request:
    paths:
      - 'KernovaKit/**'
      - '.github/workflows/**'
      - '.swift-version'
      - 'Tools/lib/package-pins.sh'
      - 'Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push supersedes its older run; every other run owns
# its commit's group, so no main commit's run is cancelled or dropped while
# pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-version:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false

      - name: Read .swift-version
        id: read
        run: echo "version=$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (aarch64)
    needs: swift-version
    runs-on: ubuntu-24.04-arm
    container: swift:${{ needs.swift-version.outputs.version }}-noble
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # KernovaPlatformLinuxTests start their own dbus-daemon; ISO9660WriterTests
      # read the image back with xorriso.
      - name: Install dbus-daemon and xorriso
        run: apt-get update && apt-get install --yes --no-install-recommends dbus xorriso

      - name: Build
        shell: bash
        run: . Tools/lib/package-pins.sh && with_package_pins KernovaKit swift build --

      # The static SDK has no Testing module, so the tests run on the
      # container's glibc toolchain.
      - name: Test
        shell: bash
        run: . Tools/lib/package-pins.sh && with_package_pins KernovaKit swift test --

  windows:
    name: Windows (arm64)
    needs: swift-version
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # swift.org's own installer. It records PATH and SDKROOT in the
      # registry, which a later step's environment is not rebuilt from, so the
      # values it set are handed on through GITHUB_PATH and GITHUB_ENV.
      - name: Install Swift
        shell: pwsh
        run: |
          $version = '${{ needs.swift-version.outputs.version }}'
          $release = "swift-$version-RELEASE"
          $url = "https://download.swift.org/swift-$version-release/windows10-arm64/$release/$release-windows10-arm64.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The Swift installer exited $($process.ExitCode)" }

          $before = $env:Path -split ';'
          foreach ($scope in 'Machine', 'User') {
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($path) {
              $path -split ';' | Where-Object { $_ -and ($before -notcontains $_) } | ForEach-Object {
                Add-Content -Path $env:GITHUB_PATH -Value $_
              }
            }
            $sdkRoot = [Environment]::GetEnvironmentVariable('SDKROOT', $scope)
            if ($sdkRoot) { Add-Content -Path $env:GITHUB_ENV -Value "SDKROOT=$sdkRoot" }
          }

      - name: Show the toolchain
        run: swift --version

      # Git for Windows' bash, so the build takes its pins the way every
      # other platform does.
      - name: Build
        shell: bash
        run: . Tools/lib/package-pins.sh && with_package_pins KernovaKit swift build --

      - name: Test
        shell: bash
        run: . Tools/lib/package-pins.sh && with_package_pins KernovaKit swift test --
