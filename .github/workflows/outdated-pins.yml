name: Outdated Pins

# Tools/outdated-pins.sh, the same report `make outdated-pins` prints, kept in
# a tracking issue.
on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Main's runs queue so two tracker jobs never edit the issue at once; a branch
# dispatch neither waits behind them nor displaces a pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      behind: ${{ steps.report.outputs.behind }}
      verdict: ${{ steps.report.outputs.verdict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Report the pins behind upstream
        id: report
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          Tools/outdated-pins.sh --markdown "$RUNNER_TEMP/report/sections.md" --summary "$GITHUB_OUTPUT"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outdated-pins
          path: ${{ runner.temp }}/report
          retention-days: 14

  tracker:
    # Only main's report owns the tracking issue, so a branch dispatch reports
    # without opening, editing or closing it.
    if: github.ref == 'refs/heads/main'
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout the tracking-issue script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: /Tools/tracking-issue.sh
          sparse-checkout-cone-mode: false

      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outdated-pins
          path: report

      - name: Manage tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BEHIND: ${{ needs.report.outputs.behind }}
          VERDICT: ${{ needs.report.outputs.verdict }}
        run: |
          set -euo pipefail
          tracker=(Tools/tracking-issue.sh "Area: Build & CI" "Outdated pins" .github/workflows/outdated-pins.yml)
          if [ "$VERDICT" = clean ]; then
            "${tracker[@]}" clean
          else
            "${tracker[@]}" "$VERDICT" "Outdated pins: $BEHIND behind their newest release" \
              "pins behind their newest release: $BEHIND" report/sections.md
          fi
