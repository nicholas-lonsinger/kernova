name: Dead Code Scan

# Each platform scans its own build natively, and a finding is reported only
# when no platform uses it: `make dead-code` on macOS, Tools/dead-code-linux.sh
# on Linux, then Tools/DeadCode combines the two bundles.
on:
  schedule:
    - cron: '0 13 * * 0'  # Sundays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Main's scans queue so two tracker jobs never edit the issue at once; a
# branch dispatch neither waits behind them nor displaces a pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swift-version:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false

      - name: Read .swift-version
        id: read
        run: echo "version=$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"

  # The Linux scan's production view needs the targets only tests reach, and
  # only the Xcode project and the macOS manifest show what the app links.
  targets:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install dead-code
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-dead-code-tool.sh dead-code

      - name: List the targets only tests reach
        run: make dead-code-targets > test-only-targets.txt

      - name: Upload the list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dead-code-targets
          path: test-only-targets.txt
          retention-days: 14

  macos:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install the swift.org toolchain
        uses: ./.github/actions/swift-toolchain

      - name: Install Periphery and indexutil-export
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-periphery.sh

      - name: Install dead-code
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-dead-code-tool.sh dead-code

      - name: Install dead-code-sources
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-dead-code-tool.sh dead-code-sources

      # The same target a developer runs; the Makefile owns the flags.
      - name: Scan
        run: make dead-code

      - name: Upload the macOS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dead-code-macos
          path: DerivedData/Periphery/Report/macos
          retention-days: 14

  linux:
    needs: [swift-version, targets]
    runs-on: ubuntu-24.04-arm
    container: swift:${{ needs.swift-version.outputs.version }}-noble
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Periphery and indexutil-export
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-periphery.sh

      - name: Install dead-code
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-dead-code-tool.sh dead-code

      - name: Install dead-code-sources
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-dead-code-tool.sh dead-code-sources

      - name: Download the test-only targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dead-code-targets
          path: ${{ runner.temp }}/targets

      - name: Scan
        run: Tools/dead-code-linux.sh "$RUNNER_TEMP/targets/test-only-targets.txt" "$RUNNER_TEMP/linux"

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dead-code-linux
          path: ${{ runner.temp }}/linux
          retention-days: 14

  report:
    needs: [swift-version, macos, linux]
    runs-on: ubuntu-24.04-arm
    container: swift:${{ needs.swift-version.outputs.version }}-noble
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      dead: ${{ steps.combine.outputs.dead }}
      test_only: ${{ steps.combine.outputs.test_only }}
      verdict: ${{ steps.combine.outputs.verdict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            /.github/actions/
            /Tools/DeadCode/
            /Tools/lib/
            /Tools/install-dead-code-tool.sh
          sparse-checkout-cone-mode: false

      - name: Download the macOS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dead-code-macos
          path: ${{ runner.temp }}/macos

      - name: Download the Linux bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dead-code-linux
          path: ${{ runner.temp }}/linux

      - name: Install dead-code
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-dead-code-tool.sh dead-code

      - name: Combine
        id: combine
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          "$(Tools/install-dead-code-tool.sh dead-code)" report \
            --platform macos="$RUNNER_TEMP/macos" \
            --platform linux="$RUNNER_TEMP/linux" \
            --markdown "$RUNNER_TEMP/report/sections.md" \
            --rest "the dead-code-report artifact of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --json "$RUNNER_TEMP/report/combined.json" \
            --summary "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/report/report.txt"

      - name: Upload the combined report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dead-code-report
          path: ${{ runner.temp }}/report
          retention-days: 14

  tracker:
    # Only the canonical scan of the default branch owns the tracking issue.
    # Branch / PR `workflow_dispatch` runs still scan and upload their
    # artifacts, but must never edit, close, or open the shared tracker —
    # otherwise a clean branch would wrongly close the issue that reflects
    # `main`.
    if: github.ref == 'refs/heads/main'
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the tracking-issue script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: /Tools/tracking-issue.sh
          sparse-checkout-cone-mode: false

      - name: Download the combined report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dead-code-report
          path: report

      - name: Manage tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEAD: ${{ needs.report.outputs.dead }}
          TEST_ONLY: ${{ needs.report.outputs.test_only }}
          VERDICT: ${{ needs.report.outputs.verdict }}
        run: |
          set -euo pipefail

          # The combined report's verdict is the tracking issue's only input:
          # the tracker closes on an explicit clean verdict alone, and a
          # verdict that disagrees with its counts fails the job rather than
          # closing the tracker on a report nobody could read.
          case "$VERDICT" in
            clean) [ "$DEAD" -eq 0 ] && [ "$TEST_ONLY" -eq 0 ] ;;
            findings) [ $((DEAD + TEST_ONLY)) -gt 0 ] ;;
            *) false ;;
          esac || {
            echo "::error::The combined report's verdict '$VERDICT' does not match its counts ($DEAD dead, $TEST_ONLY reached only by tests)"
            exit 1
          }

          tracker=(Tools/tracking-issue.sh "Dead Code" "Dead-code scan" .github/workflows/dead-code.yml)
          if [ "$VERDICT" = clean ]; then
            "${tracker[@]}" clean
            exit 0
          fi

          body=$(mktemp)
          {
            echo "macOS scans the Xcode schemes and the packages they build; Linux scans KernovaKit, the Linux agent's sources included. A finding is listed only when no platform uses it, and \`[macOS only]\` or \`[Linux only]\` marks one only that platform compiles. *Reached only by tests* lists what the scan reports with every target only tests reach left out of the build. Code inside \`#if DEBUG\`, which a Release build leaves out, is not on that list; it is listed as dead when nothing uses it."
            echo
            cat report/sections.md
          } > "$body"
          "${tracker[@]}" findings "Dead-code scan: $DEAD dead, $TEST_ONLY reached only by tests" \
            "$DEAD dead on every platform, $TEST_ONLY reached only by tests" "$body"
