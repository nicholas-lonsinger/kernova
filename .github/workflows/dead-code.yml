name: Dead Code Scan

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"

      # Tools/install-periphery.sh owns the version and the install location,
      # so this job and a developer's `make dead-code` scan alike.
      - name: Resolve the pinned Periphery release
        run: |
          set -euo pipefail
          echo "PERIPHERY_VERSION=$(Tools/install-periphery.sh --version)" >> "$GITHUB_ENV"
          echo "PERIPHERY_DIR=$(dirname "$(Tools/install-periphery.sh --path)")" >> "$GITHUB_ENV"

      - name: Cache Periphery binary
        uses: actions/cache@v5
        with:
          path: ${{ env.PERIPHERY_DIR }}
          key: periphery-${{ env.PERIPHERY_VERSION }}-${{ runner.os }}

      - name: Install Periphery
        run: Tools/install-periphery.sh

      - name: Run Periphery scan
        id: scan
        run: |
          set +e
          # The same target a developer runs; the Makefile owns the flags.
          make dead-code > scan-output.txt 2> scan-stderr.txt
          PERIPHERY_EXIT=$?
          set -e

          if [ "$PERIPHERY_EXIT" -ne 0 ]; then
            echo "::error::Periphery exited with code $PERIPHERY_EXIT"
            echo "--- stderr ---"
            cat scan-stderr.txt
            echo "--- stdout (first 200 lines) ---"
            head -200 scan-output.txt
            exit "$PERIPHERY_EXIT"
          fi

          findings=$(grep -cE ":[0-9]+:[0-9]+: warning:" scan-output.txt || true)

          # This parse is the tracking issue's only input, so a zero count is
          # trusted only alongside the explicit clean verdict; otherwise the
          # job fails rather than closing the tracker on a scan nobody could
          # parse.
          if [ "$findings" -eq 0 ] && ! grep -q "No unused code detected" scan-output.txt; then
            echo "::error::Periphery reported no findings and no clean verdict — output format unrecognised"
            cat scan-output.txt
            exit 1
          fi

          echo "findings=$findings" >> "$GITHUB_OUTPUT"
          echo "Periphery surfaced $findings finding(s)"

          if [ "$findings" -gt 0 ]; then
            echo "--- Findings ---"
            cat scan-output.txt
          fi

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: periphery-scan
          path: |
            scan-output.txt
            scan-stderr.txt
          retention-days: 14

      - name: Manage tracking issue
        # Only the canonical scan of the default branch owns the tracking
        # issue. Branch / PR `workflow_dispatch` runs still scan and upload
        # their artifacts, but must never edit, close, or open the shared
        # tracker — otherwise a clean branch would wrongly close the issue
        # that reflects `main`.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          TRACKER_LABEL: "Dead Code"
        run: |
          set -euo pipefail

          # The live tracker is the single OPEN issue, if any. Each scan writes
          # a complete snapshot — findings are never merged across runs — and
          # closed issues are immutable history.
          OPEN_ISSUE=$(gh issue list \
            --label "$TRACKER_LABEL" \
            --state open \
            --limit 1 \
            --json number,title \
            --jq 'map(select(.title | startswith("Dead-code scan"))) | .[0].number // empty')

          if [ "$FINDINGS" -eq 0 ]; then
            if [ -n "$OPEN_ISSUE" ]; then
              gh issue comment "$OPEN_ISSUE" \
                --body "Scan ran clean on $(date -u +%Y-%m-%dT%H:%MZ) — closing. A new issue is opened automatically if findings reappear."
              gh issue close "$OPEN_ISSUE"
            fi
            exit 0
          fi

          BODY_FILE=$(mktemp)
          {
            echo "Last scan: $(date -u +%Y-%m-%dT%H:%MZ) — **$FINDINGS finding(s)**"
            echo
            echo "Auto-managed by [\`.github/workflows/dead-code.yml\`](.github/workflows/dead-code.yml). Runs weekly (Mondays 14:00 UTC) and on \`workflow_dispatch\` against \`main\`. Each scan fully replaces the list below — findings are never combined across runs. The next clean scan closes this issue if a PR hasn't already; a brand-new issue is opened if findings reappear later."
            echo
            echo "<details><summary>Periphery output</summary>"
            echo
            echo '```'
            cat scan-output.txt
            echo '```'
            echo
            echo "</details>"
          } > "$BODY_FILE"

          if [ -n "$OPEN_ISSUE" ]; then
            # Low churn: refresh the live issue in place. The body is replaced
            # wholesale, so the new findings supersede the old — never appended.
            gh issue edit "$OPEN_ISSUE" \
              --title "Dead-code scan: $FINDINGS finding(s)" \
              --body-file "$BODY_FILE"
          else
            # No live issue — open a fresh one. If a prior (closed) tracker
            # exists, cross-link it so it is unambiguous that this new set
            # supersedes, and does not extend, the old one.
            PREV_CLOSED=$(gh issue list \
              --label "$TRACKER_LABEL" \
              --state closed \
              --limit 1 \
              --json number,title \
              --jq 'map(select(.title | startswith("Dead-code scan"))) | .[0].number // empty')

            if [ -n "$PREV_CLOSED" ]; then
              { echo "Supersedes #$PREV_CLOSED — these findings replace that issue's list; they are not combined with it."; echo; cat "$BODY_FILE"; } > "${BODY_FILE}.linked"
              mv "${BODY_FILE}.linked" "$BODY_FILE"
            fi

            NEW_URL=$(gh issue create \
              --title "Dead-code scan: $FINDINGS finding(s)" \
              --label "$TRACKER_LABEL" \
              --body-file "$BODY_FILE")
            echo "Opened $NEW_URL"

            if [ -n "$PREV_CLOSED" ]; then
              NEW_NUM="${NEW_URL##*/}"
              gh issue comment "$PREV_CLOSED" \
                --body "Superseded by #$NEW_NUM — newer scan with current findings. This issue's list is historical and is not combined with the new one."
            fi
          fi
