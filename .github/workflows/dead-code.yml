name: Dead Code Scan

# Each platform scans its own build natively, and a finding is reported only
# when no platform uses it: `make dead-code` on macOS, Tools/dead-code-linux.sh
# on Linux, then Tools/DeadCode combines the two bundles.
on:
  schedule:
    - cron: '0 13 * * 0'  # Sundays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  swift-version:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false

      - name: Read .swift-version
        id: read
        run: echo "version=$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"

  # The Linux scan's production view needs the targets only tests reach, and
  # only the Xcode project and the macOS manifest show what the app links.
  targets:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: List the targets only tests reach
        run: make dead-code-targets > test-only-targets.txt

      - name: Upload the list
        uses: actions/upload-artifact@v6
        with:
          name: dead-code-targets
          path: test-only-targets.txt
          retention-days: 14

  macos:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install the swift.org toolchain
        uses: ./.github/actions/swift-toolchain

      - name: Install Periphery and indexutil-export
        run: Tools/install-periphery.sh && Tools/install-periphery.sh --indexutil-export

      # The same target a developer runs; the Makefile owns the flags.
      - name: Scan
        run: make dead-code

      - name: Upload the macOS bundle
        uses: actions/upload-artifact@v6
        with:
          name: dead-code-macos
          path: DerivedData/Periphery/Report/macos
          retention-days: 14

  linux:
    needs: [swift-version, targets]
    runs-on: ubuntu-24.04-arm
    container: swift:${{ needs.swift-version.outputs.version }}-noble
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Locate Periphery
        id: periphery
        run: echo "dir=$(dirname "$(Tools/install-periphery.sh --path)")" >> "$GITHUB_OUTPUT"

      # Built from source against this toolchain's libIndexStore.so (minutes).
      - name: Restore Periphery and indexutil-export
        uses: actions/cache@v5
        with:
          path: ${{ steps.periphery.outputs.dir }}
          key: periphery-${{ runner.os }}-${{ runner.arch }}-swift-${{ needs.swift-version.outputs.version }}-${{ hashFiles('Tools/install-periphery.sh') }}

      - name: Download the test-only targets
        uses: actions/download-artifact@v6
        with:
          name: dead-code-targets
          path: ${{ runner.temp }}/targets

      - name: Scan
        run: Tools/dead-code-linux.sh "$RUNNER_TEMP/targets/test-only-targets.txt" "$RUNNER_TEMP/linux"

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v6
        with:
          name: dead-code-linux
          path: ${{ runner.temp }}/linux
          retention-days: 14

  report:
    needs: [swift-version, macos, linux]
    runs-on: ubuntu-24.04-arm
    container: swift:${{ needs.swift-version.outputs.version }}-noble
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      dead: ${{ steps.combine.outputs.dead }}
      test_only: ${{ steps.combine.outputs.test_only }}
      verdict: ${{ steps.combine.outputs.verdict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: Tools/DeadCode

      - name: Download the macOS bundle
        uses: actions/download-artifact@v6
        with:
          name: dead-code-macos
          path: ${{ runner.temp }}/macos

      - name: Download the Linux bundle
        uses: actions/download-artifact@v6
        with:
          name: dead-code-linux
          path: ${{ runner.temp }}/linux

      - name: Combine
        id: combine
        run: |
          swift build -c release --quiet --package-path Tools/DeadCode
          mkdir -p "$RUNNER_TEMP/report"
          Tools/DeadCode/.build/release/dead-code report \
            --platform macos="$RUNNER_TEMP/macos" \
            --platform linux="$RUNNER_TEMP/linux" \
            --markdown "$RUNNER_TEMP/report/sections.md" \
            --rest "the dead-code-report artifact of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --json "$RUNNER_TEMP/report/combined.json" \
            --summary "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/report/report.txt"

      - name: Upload the combined report
        uses: actions/upload-artifact@v6
        with:
          name: dead-code-report
          path: ${{ runner.temp }}/report
          retention-days: 14

  tracker:
    # Only the canonical scan of the default branch owns the tracking issue.
    # Branch / PR `workflow_dispatch` runs still scan and upload their
    # artifacts, but must never edit, close, or open the shared tracker —
    # otherwise a clean branch would wrongly close the issue that reflects
    # `main`.
    if: github.ref == 'refs/heads/main'
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download the combined report
        uses: actions/download-artifact@v6
        with:
          name: dead-code-report
          path: report

      - name: Manage tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEAD: ${{ needs.report.outputs.dead }}
          TEST_ONLY: ${{ needs.report.outputs.test_only }}
          VERDICT: ${{ needs.report.outputs.verdict }}
          TRACKER_LABEL: "Dead Code"
        run: |
          set -euo pipefail

          # The combined report's verdict is the tracking issue's only input:
          # the tracker closes on an explicit clean verdict alone, and a
          # verdict that disagrees with its counts fails the job rather than
          # closing the tracker on a report nobody could read.
          case "$VERDICT" in
            clean) [ "$DEAD" -eq 0 ] && [ "$TEST_ONLY" -eq 0 ] ;;
            findings) [ $((DEAD + TEST_ONLY)) -gt 0 ] ;;
            *) false ;;
          esac || {
            echo "::error::The combined report's verdict '$VERDICT' does not match its counts ($DEAD dead, $TEST_ONLY reached only by tests)"
            exit 1
          }

          # The live tracker is the single OPEN issue, if any. Each scan writes
          # a complete snapshot — findings are never merged across runs — and
          # closed issues are immutable history.
          OPEN_ISSUE=$(gh issue list \
            --label "$TRACKER_LABEL" \
            --state open \
            --limit 50 \
            --json number,title \
            --jq 'map(select(.title | startswith("Dead-code scan"))) | .[0].number // empty')

          if [ "$VERDICT" = clean ]; then
            if [ -n "$OPEN_ISSUE" ]; then
              gh issue comment "$OPEN_ISSUE" \
                --body "Scan ran clean on $(date -u +%Y-%m-%dT%H:%MZ) — closing. A new issue is opened automatically if findings reappear."
              gh issue close "$OPEN_ISSUE"
            fi
            exit 0
          fi

          TITLE="Dead-code scan: $DEAD dead, $TEST_ONLY reached only by tests"
          BODY_FILE=$(mktemp)
          {
            echo "Last scan: $(date -u +%Y-%m-%dT%H:%MZ) — **$DEAD dead on every platform, $TEST_ONLY reached only by tests**"
            echo
            echo "Auto-managed by [\`.github/workflows/dead-code.yml\`](.github/workflows/dead-code.yml). Runs weekly and on \`workflow_dispatch\` against \`main\`. Each scan fully replaces the lists below — findings are never combined across runs. The next clean scan closes this issue if a PR hasn't already; a brand-new issue is opened if findings reappear later."
            echo
            echo "macOS scans the Xcode schemes and the packages they build; Linux scans KernovaKit, the Linux agent's sources included. A finding is listed only when no platform uses it, and \`[macOS only]\` or \`[Linux only]\` marks one only that platform compiles. *Reached only by tests* lists what the scan reports with every target only tests reach left out of the build."
            echo
            cat report/sections.md
          } > "$BODY_FILE"

          if [ -n "$OPEN_ISSUE" ]; then
            # Low churn: refresh the live issue in place. The body is replaced
            # wholesale, so the new findings supersede the old — never appended.
            gh issue edit "$OPEN_ISSUE" --title "$TITLE" --body-file "$BODY_FILE"
          else
            # No live issue — open a fresh one. If a prior (closed) tracker
            # exists, cross-link it so it is unambiguous that this new set
            # supersedes, and does not extend, the old one.
            PREV_CLOSED=$(gh issue list \
              --label "$TRACKER_LABEL" \
              --state closed \
              --limit 50 \
              --json number,title \
              --jq 'map(select(.title | startswith("Dead-code scan"))) | .[0].number // empty')

            if [ -n "$PREV_CLOSED" ]; then
              { echo "Supersedes #$PREV_CLOSED — these findings replace that issue's list; they are not combined with it."; echo; cat "$BODY_FILE"; } > "${BODY_FILE}.linked"
              mv "${BODY_FILE}.linked" "$BODY_FILE"
            fi

            NEW_URL=$(gh issue create \
              --title "$TITLE" \
              --label "$TRACKER_LABEL" \
              --body-file "$BODY_FILE")
            echo "Opened $NEW_URL"

            if [ -n "$PREV_CLOSED" ]; then
              NEW_NUM="${NEW_URL##*/}"
              gh issue comment "$PREV_CLOSED" \
                --body "Superseded by #$NEW_NUM — newer scan with current findings. This issue's list is historical and is not combined with the new one."
            fi
          fi
