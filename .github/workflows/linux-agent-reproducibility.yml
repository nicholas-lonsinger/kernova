name: Linux Agent Reproducibility

# Builds kernova-agent twice, from two copies of the checkout, each with an
# empty tool cache, and checks the two are byte-identical: what the prefix maps
# in Tools/install-linux-guest-agent.sh keep true, and a toolchain release can
# break. Elsewhere a machine builds each set of inputs once and copies that
# build. The copies' paths are of one length, because Swift writes the length
# of a source file's unmapped path into withoutActuallyEscaping's escape check
# (issue #2059).
on:
  schedule:
    - cron: '41 13 * * 0'  # Sundays 13:41 UTC
  pull_request:
    paths:
      - '.swift-version'
      - 'Tools/lib/static-linux-sdk.sh'
      - 'Tools/install-linux-guest-agent.sh'
      - 'Tools/check-linux-guest-agent.sh'
      - '.github/workflows/linux-agent-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-version:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false

      - name: Read .swift-version
        id: read
        run: echo "version=$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (aarch64)
    needs: swift-version
    runs-on: ubuntu-24.04-arm
    container: swift:${{ needs.swift-version.outputs.version }}-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The agent's check reads `file`; its build reads the package's
      # description with jq.
      - name: Install file and jq
        run: apt-get update && apt-get install --yes --no-install-recommends file jq

      - name: Install the Static Linux SDK
        run: |
          . Tools/lib/static-linux-sdk.sh
          version='${{ needs.swift-version.outputs.version }}'
          swift sdk install "$(static_sdk_url "$version")" --checksum "$STATIC_SDK_CHECKSUM"

      - name: Build kernova-agent from two checkout paths
        run: |
          for copy in a b; do
            mkdir "$RUNNER_TEMP/checkout-$copy"
            tar --exclude=./.git --exclude=./KernovaKit/.build -cf - . | tar -xf - -C "$RUNNER_TEMP/checkout-$copy"
            XDG_CACHE_HOME="$RUNNER_TEMP/cache-$copy" \
              "$RUNNER_TEMP/checkout-$copy/Tools/build-linux-guest-agent.sh" --output "$RUNNER_TEMP/$copy/kernova-agent"
          done

      - name: Check kernova-agent
        run: Tools/check-linux-guest-agent.sh "$RUNNER_TEMP/a/kernova-agent" "$RUNNER_TEMP/b/kernova-agent"
