name: Proto Drift

# A required status check has to report on every PR, and a workflow-level
# `paths:` filter skips the run entirely — GitHub then waits on a status that
# never arrives. Relevance is therefore decided inside the job: the first step
# diffs the changed paths against this workflow's pattern and short-circuits
# the remaining steps, still reporting green so the required check is
# satisfied.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  proto-drift:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history needed so the relevance-filter step below can
          # `git diff` against the PR base (or the push parent).
          fetch-depth: 0

      - name: Check for proto-relevant changes
        id: filter
        run: |
          set -euo pipefail
          # Files whose changes warrant a real drift check. Mirrors what
          # the workflow-level `paths:` filter used to enumerate.
          pattern='^(KernovaKit/(Proto/|Sources/KernovaKit/Generated/|Package\.swift)|Kernova\.xcodeproj/project\.xcworkspace/xcshareddata/swiftpm/Package\.resolved|Tools/regen-proto\.sh|\.github/workflows/proto-drift\.yml)'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch — always running the full check"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi

          # First push to a new branch (or rewritten history) has no
          # usable base — default to running the full check rather than
          # silently skipping.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base SHA available — running the full check"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed_files"
          if echo "$changed_files" | grep -qE "$pattern"; then
            echo "Proto-relevant files changed — running the full drift check"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No proto-relevant files changed — reporting success without running the drift check"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.filter.outputs.changed == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"

      - name: Install protoc
        if: steps.filter.outputs.changed == 'true'
        run: |
          Tools/brew-install.sh protoc:protobuf
          protoc --version

      # Tools/regen-proto.sh builds protoc-gen-swift into KernovaKit/.build
      # from the revision Package.resolved pins, so the key tracks that file.
      - name: Cache SwiftPM build for protoc-gen-swift
        if: steps.filter.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: KernovaKit/.build
          key: ${{ runner.os }}-proto-drift-${{ env.XCODE_BUILD }}-${{ hashFiles('Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Regenerate Swift bindings
        if: steps.filter.outputs.changed == 'true'
        run: Tools/regen-proto.sh

      - name: Check for drift
        if: steps.filter.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet KernovaKit/Sources/KernovaKit/Generated; then
            echo "::error::Generated Swift bindings are out of sync with kernova.proto and/or the pinned swift-protobuf version. Run Tools/regen-proto.sh and commit the result."
            echo
            echo "--- Diff ---"
            git diff KernovaKit/Sources/KernovaKit/Generated
            exit 1
          fi
          echo "Generated bindings match what protoc-gen-swift would emit."
