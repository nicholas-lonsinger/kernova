name: Lint, Build & Test

on:
  push:
    branches: [main]
  # A PR is linted and tested only while it carries the `ci` label.
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A commit with its parent's build inputs (Tools/attest.sh) is not built or
  # tested again once the parent is attested: that attestation stands for both.
  inputs:
    if: &requested github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      attested: ${{ steps.parent.outputs.attested }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: Tools

      - name: Find an attested parent with the same build inputs
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attested="$(Tools/attest.sh attested-parent)"
          echo "attested=$attested" | tee -a "$GITHUB_OUTPUT"

  build-and-test:
    needs: inputs
    if: needs.inputs.outputs.attested == ''
    # Job-level, so a run whose job is skipped never cancels the real run:
    # adding a second label mid-run left the labeled-`ci` run in progress while
    # the new run's job was skipped (observed 2026-10-18).
    # A pull request's newer push supersedes its older run; every other run
    # owns its commit's group, because a group holds one pending run and drops
    # the one it replaces, so a shared main group would leave commits with no
    # Commit Attestation.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      cas-key: ${{ steps.save-cas.outcome == 'success' && steps.restore-cas.outputs.cache-primary-key || '' }}
      xcode-build: ${{ steps.xcode.outputs.xcode-build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        id: xcode
        uses: ./.github/actions/select-xcode

      - name: Read where the build writes
        id: paths
        run: |
          . Tools/lib/xcodebuild-flags.sh
          echo "derived-data=$kernova_derived_data" >> "$GITHUB_OUTPUT"
          echo "compilation-cache=$kernova_compilation_cache" >> "$GITHUB_OUTPUT"

      # Package.resolved pins each dependency to a commit, so the hash misses
      # exactly when a dependency is bumped and hits otherwise. No
      # restore-keys: a prefix fallback would restore an older checkout and
      # then save the reconciled result under the new hash, so a saved entry
      # would no longer match its key by construction. Checkouts are plain
      # git clones, so the Xcode build is not part of the key.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.derived-data }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The store is content-addressed, so any earlier snapshot is a valid
      # seed: the prefix restores the newest one main saved, which a pull
      # request can read too. Its on-disk format is the toolchain's, hence the
      # Xcode build in the key.
      - name: Restore the compilation cache
        id: restore-cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.compilation-cache }}
          key: ${{ runner.os }}-cas-${{ env.XCODE_BUILD }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cas-${{ env.XCODE_BUILD }}-

      # The Linux guest agent the "Build Linux Guest Agent" phase labels and
      # bundles, built once per set of inputs; a cold build takes minutes.
      - name: Build the Linux guest agent
        uses: ./.github/actions/tool-cache
        with:
          installer: Tools/install-linux-guest-agent.sh
          swift-toolchain: 'true'

      # Debug signs ad-hoc (Config/Base.xcconfig's CODE_SIGN_IDENTITY = "-"),
      # which needs no identity or team.
      # Raw xcodebuild output throughout this workflow, not xcbeautify: its
      # github-actions renderer condenses errors — on test failures it prints
      # the failing test names alone, dropping the `#expect` text and the
      # source line that say what actually failed.
      - name: Build for testing
        run: make build-for-testing 2>&1

      # llvm-cas keeps the two newest generations (the fresh primary and its
      # read-through fallback) and deletes the rest. The listing shows which
      # generations survive and the size that will be saved.
      - name: Prune the compilation cache
        env:
          STORE: ${{ steps.paths.outputs.compilation-cache }}
        run: |
          if [ ! -d "$STORE/builtin" ]; then
            echo "No compilation cache store found."
            exit 0
          fi
          xcrun llvm-cas --cas "$STORE/builtin" --prune
          ls "$STORE/builtin"
          du -sh "$STORE"

      # A re-run saves nothing: its entry would postdate entries main saved
      # since, and prune-compilation-cache would delete those instead.
      - name: Save the compilation cache
        id: save-cas
        if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && steps.restore-cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.compilation-cache }}
          key: ${{ steps.restore-cas.outputs.cache-primary-key }}

      # The admission width caps concurrent test cases per host process. Only
      # the prefixed spelling reaches the test hosts: `xcodebuild` forwards
      # `TEST_RUNNER_`-prefixed variables to the test runner with the prefix
      # stripped and passes nothing else through, so the plain name set here
      # silently no-ops (observed 2026-08-20).
      #
      # `timeout-minutes` bounds this step rather than the job, so a stall fails
      # the step and the reporting steps below still run — the job cap instead
      # cancels the run outright, leaving the result bundle half-written and
      # nothing to read. It backs up the test plan's per-test timeouts, which
      # fail one stuck test and let the rest of the run finish, so it is sized
      # for a healthy run plus one test spending its whole allowance.
      - name: Test without building
        timeout-minutes: 12
        env:
          TEST_RUNNER_KERNOVA_TEST_ADMISSION_WIDTH: "32"
        run: make test-without-building 2>&1

      # Each test host's own stdout/stderr, which xcodebuild's stream does not
      # carry: a host that crashes or freezes says why only there.
      - name: Report test-host output
        if: failure()
        run: Tools/report-test-host-output.sh

      # xcodebuild's own stream interleaves parallel test hosts, so a failure's
      # message can land far from the test that raised it. This pairs each
      # failed case with every message it recorded, in one block.
      - name: Report failure messages
        if: failure()
        run: |
          bundle="artifacts/TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No test result bundle at $bundle — skipping failure report."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found — skipping failure report."
            exit 0
          fi
          # Keep stderr: a rejected flag or an unreadable bundle otherwise
          # degrades this step to a silent no-op with nothing to debug from.
          if ! error="$(xcrun xcresulttool get test-results tests --path "$bundle" --format json 2>&1 >/tmp/tests.json)"; then
            echo "Could not read test results at $bundle — skipping failure report. Output: $error"
            exit 0
          fi
          jq -r '
            [ .. | objects
              | select(.nodeType? == "Test Case" and .result == "Failed") ]
            | .[]
            | "=== " + (.nodeIdentifier // .name) + "\n"
              + ( [ .. | objects | select(.nodeType? == "Failure Message") | .name ]
                  | unique | join("\n") )
          ' /tmp/tests.json || echo "Could not parse test results — skipping failure report."

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          # upload-artifact roots the archive at the lowest common ancestor of the
          # matched files, so a path naming the `.xcresult` bundle itself drops
          # the bundle's wrapper: the download unpacks as a bare Info.plist +
          # Data/ that xcresulttool can't open. The parent keeps
          # `TestResults.xcresult/` (the Makefile's `RESULT_BUNDLE`) intact.
          path: artifacts/
          retention-days: 7

  # Lint reads no built product (Tools/lint.sh), so it runs on its own runner
  # beside build-and-test.
  lint:
    if: *requested
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      xcode-build: ${{ steps.xcode.outputs.xcode-build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        id: xcode
        uses: ./.github/actions/select-xcode

      - name: Ensure shellcheck
        run: Tools/brew-install.sh shellcheck

      - name: make lint
        timeout-minutes: 10
        run: make lint

  # KernovaKit's Linux tests as `make attest` runs them (Tools/lib/linux-tests.sh):
  # the same Containerfile, script and tree, with Docker and the runner's
  # resources in place of container and the Mac's limits.
  linux:
    name: Linux (aarch64)
    needs: inputs
    if: needs.inputs.outputs.attested == ''
    concurrency:
      group: ${{ github.workflow }}-linux-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build the image
        shell: bash
        run: . Tools/lib/linux-tests.sh && linux_tests_build_image docker HEAD

      - name: Test
        shell: bash
        run: . Tools/lib/linux-tests.sh && linux_tests_run docker HEAD "$(linux_tests_image HEAD)"

  # Posts once lint and either the build and tests or an attested parent have
  # an outcome; a cancelled job, or a run that lints nothing, posts nothing.
  attest:
    needs: [inputs, build-and-test, lint, linux]
    if: ${{ !cancelled() && needs.lint.result != 'skipped' && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: Tools

      - name: Post the Commit Attestation status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.lint.result == 'success' && needs.inputs.result == 'success' && (needs.inputs.outputs.attested != '' || (needs.build-and-test.result == 'success' && needs.linux.result == 'success')) && 'success' || 'failure' }}
          ATTESTED: ${{ needs.inputs.outputs.attested }}
          LINT_XCODE: ${{ needs.lint.outputs.xcode-build }}
          TEST_XCODE: ${{ needs.build-and-test.outputs.xcode-build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The two macOS jobs run on separate runners, which an image rollout
        # can give different Xcode builds.
        run: |
          if [ -n "$ATTESTED" ]; then
            description="Lint on Xcode $LINT_XCODE; Build & Test and Linux as attested on ${ATTESTED:0:9}, whose build inputs these are"
          elif [ "$LINT_XCODE" = "$TEST_XCODE" ]; then
            description="Lint, Build & Test on Xcode $TEST_XCODE and Linux"
          else
            description="Lint on Xcode $LINT_XCODE, Build & Test on Xcode $TEST_XCODE, and Linux"
          fi
          Tools/attest.sh post "$STATE" "$description" "$RUN_URL"

  # Its own job, so the build that runs the tree's scripts never holds a token
  # that can delete caches.
  prune-compilation-cache:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.cas-key != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # An entry saved after this run's own stays, so concurrent main runs
      # never delete each other's newest. Another Xcode build's entries stay
      # until GitHub evicts them unused, which keeps a runner fleet that is
      # mid-image-rollout warm on both builds.
      - name: Delete main's compilation caches saved before this run's
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ needs.build-and-test.outputs.cas-key }}
        run: |
          set -euo pipefail
          prefix="${KEY%-*}-"
          older="$(gh cache list --ref refs/heads/main --key "$prefix" --sort created_at --order desc --limit 100 --json id,key \
            --jq '(map(.key) | index($ENV.KEY)) as $own | if $own == null then "missing" else .[$own + 1:][].id end')"
          if [ "$older" = missing ]; then
            echo "::warning::$KEY is not among main's caches, so none were deleted"
            exit 0
          fi
          for id in $older; do
            echo "Deleting cache $id"
            # A concurrent main run's prune deletes the same entries; gone is the goal.
            if ! error="$(gh api --method DELETE "repos/$GH_REPO/actions/caches/$id" 2>&1)"; then
              case "$error" in
                *"HTTP 404"*) echo "Already deleted" ;;
                *) echo "$error"; exit 1 ;;
              esac
            fi
          done
