name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          # Nested under DerivedData/Kernova to match the Makefile's canonical
          # layout (see below). The key's `spm2` segment marks that move: a
          # same-key cache saved at the old flat path would restore uselessly
          # and, existing, block a save at the new path.
          path: DerivedData/Kernova/SourcePackages
          key: ${{ runner.os }}-spm2-${{ env.XCODE_BUILD }}-${{ hashFiles('Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          # A Package.resolved or Xcode bump misses the exact key; a stale
          # checkout is still a valid seed (SwiftPM reconciles against
          # Package.resolved and fetches only the delta). Checkouts are plain
          # git clones, so the Xcode-agnostic prefix is a valid last resort.
          restore-keys: |
            ${{ runner.os }}-spm2-${{ env.XCODE_BUILD }}-
            ${{ runner.os }}-spm2-

      - name: Cache compilation cache
        uses: actions/cache@v5
        with:
          # Xcode 26's compilation cache (COMPILATION_CACHE_ENABLE_CACHING on
          # the build step below) lives inside DerivedData; the glob tracks
          # the store's folder whatever exact name Xcode gives it.
          path: DerivedData/Kernova/CompilationCache*
          # The store is content-addressed, so any prior snapshot is a valid
          # seed. The per-commit key exists only so every run saves its
          # updated store; the prefix restore pulls the most recent one.
          key: ${{ runner.os }}-cas-${{ env.XCODE_BUILD }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cas-${{ env.XCODE_BUILD }}-

      # Debug signs ad-hoc (Config/Base.xcconfig's CODE_SIGN_IDENTITY = "-"),
      # which needs no identity or team, so it embeds the app's sandbox
      # entitlements and the TEST_HOST-hosted unit tests run sandboxed here
      # exactly as they do locally.
      # Raw xcodebuild output throughout this workflow, not xcbeautify: its
      # github-actions renderer condenses errors — on test failures it prints
      # the failing test names alone, dropping the `#expect` text and the
      # source line that say what actually failed.
      - name: Build for testing
        run: make build-for-testing 2>&1

      # The store's size after a build is the signal that caching engaged:
      # empty or missing means COMPILATION_CACHE_ENABLE_CACHING no-opped, and
      # the build step's wall clock across runs is then measuring nothing.
      - name: Report compilation cache size
        run: du -sh DerivedData/Kernova/CompilationCache* 2>/dev/null || echo "No compilation cache store found."

      # The admission width caps concurrent test cases per host process (three
      # hosts run at once, so the machine-wide bound is 3×). It is a herd cap
      # sized for headroom as the suite grows, not a tuning knob: the suite
      # must stay green at any width, and a flake a width change surfaces gets
      # fixed or deleted (docs/TESTING.md, "Flaky tests"), never quieted by
      # re-tuning this number. Only the prefixed spelling reaches the test
      # hosts: `xcodebuild` forwards `TEST_RUNNER_`-prefixed variables to the
      # test runner with the prefix stripped and passes nothing else through,
      # so the plain name set here silently no-ops and the run measures
      # pass-through (observed 2026-08-20).
      - name: Test without building
        env:
          TEST_RUNNER_KERNOVA_TEST_ADMISSION_WIDTH: "32"
        run: make test-without-building 2>&1

      # xcodebuild's own stream interleaves parallel test hosts, so a failure's
      # message can land far from the test that raised it. This pairs each
      # failed case with every message it recorded, in one block.
      - name: Report failure messages
        if: always()
        run: |
          bundle="artifacts/TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No test result bundle at $bundle — skipping failure report."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found — skipping failure report."
            exit 0
          fi
          # Keep stderr: a rejected flag or an unreadable bundle otherwise
          # degrades this step to a silent no-op with nothing to debug from.
          if ! error="$(xcrun xcresulttool get test-results tests --path "$bundle" --format json 2>&1 >/tmp/tests.json)"; then
            echo "Could not read test results at $bundle — skipping failure report. Output: $error"
            exit 0
          fi
          # A retried case passes overall while one Repetition failed, so match
          # on either: the masked attempt's message is the one worth reading.
          jq -r '
            [ .. | objects
              | select(.nodeType? == "Test Case")
              | select(.result == "Failed"
                       or any(.children[]?; .nodeType == "Repetition" and .result == "Failed")) ]
            | .[]
            | "=== " + (.nodeIdentifier // .name) + "\n"
              + ( [ .. | objects | select(.nodeType? == "Failure Message") | .name ]
                  | unique | join("\n") )
          ' /tmp/tests.json || echo "Could not parse test results — skipping failure report."

      # `TestAdmission` resolves its width once per test-host process and logs
      # the outcome through `Logger`, which writes to the unified log rather
      # than the runner's stdout — so this is the only place the resolved arm is
      # visible. Each test-host process emits exactly one line, so this also
      # counts the hosts the width had to reach. Without it a width that never
      # arrived is indistinguishable from one that did, and the run silently
      # measures pass-through.
      - name: Report admission arm
        if: always()
        run: |
          log show \
            --predicate 'subsystem == "app.kernova" AND category == "TestAdmission"' \
            --last 30m --style compact || echo "log show unavailable"

      # Kernova.xctestplan runs with retryOnFailure (maximumTestRepetitions: 2):
      # it re-runs the whole bundle and lets a test that failed its first attempt
      # pass the job on a retry, silently masking the flake — a green run can hide
      # a ~35%-flaky test (which is exactly how #523 stayed green for a day). This
      # step reads the result bundle and warns on any test with a failed attempt,
      # so a passed-on-retry flake is visible instead of an invisible green. It is
      # visibility-only and never fails the job (retryOnFailure still guards merges).
      - name: Report flaky (retried) tests
        if: always()
        run: |
          bundle="artifacts/TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No test result bundle at $bundle — skipping flake report."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found — skipping flake report."
            exit 0
          fi
          # Each attempt is a "Repetition" node; a genuine flake failed at least
          # one Repetition but still passed overall (a bundle-wide retry marks
          # every passed test's repetitions "Passed", so this does not
          # false-positive on the other tests dragged through the retry). A test
          # that failed every repetition is broken, not flaky — it already fails
          # the job on its own via xcodebuild's exit code, so `result == "Passed"`
          # excludes it here to avoid mislabeling it as a mere flake. Dedup on
          # `.nodeIdentifier` (suite-qualified) rather than `.name` (bare display
          # name), since two unrelated suites can share a test's display name.
          if ! flaky="$(xcrun xcresulttool get test-results tests --path "$bundle" 2>&1 | jq -r '
                [ .. | objects
                  | select(.nodeType? == "Test Case" and .result == "Passed")
                  | select(any(.children[]?; .nodeType == "Repetition" and .result == "Failed"))
                  | (.nodeIdentifier // .name) ] | unique[]' 2>&1)"; then
            echo "Could not read/parse test results at $bundle — skipping flake report. Output: $flaky"
            exit 0
          fi
          if [ -z "$flaky" ]; then
            echo "No flaky (failed-then-retried) tests in this run."
            exit 0
          fi
          {
            echo "### ⚠️ Flaky tests (failed at least one attempt)"
            echo ""
            echo "Retried via \`retryOnFailure\`, so these may have passed the job on a later attempt. Investigate before they degrade further:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" || true
          while IFS= read -r name; do
            # GitHub's `::` workflow-command protocol requires literal `%` in the
            # message to be percent-encoded so it isn't misparsed as an escape.
            escaped="${name//%/%25}"
            echo "::warning title=Flaky test (failed then retried)::${escaped}"
            echo "- \`${name}\`" >> "$GITHUB_STEP_SUMMARY" || true
          done <<< "$flaky"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          # RATIONALE: upload the PARENT dir, not the `.xcresult` bundle directly.
          # upload-artifact roots the archive at the lowest common ancestor of the
          # matched files, so pointing it at the bundle drops the `.xcresult`
          # wrapper — the download then unpacks as a bare Info.plist + Data/ that
          # xcresulttool can't open without first renaming it back. Uploading the
          # enclosing `artifacts/` keeps `TestResults.xcresult/` intact in the
          # download (matching the Makefile's `RESULT_BUNDLE`), so `gh run
          # download` yields a directly-usable result bundle.
          path: artifacts/
          retention-days: 7
