name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # SPIKE (test admission gate): the two arms of the A/B measurement.
        # "0" is pass-through — today's behavior, every test in flight at once.
        # "16" bounds the in-flight set per test-host process. Same binary in
        # both arms; only the resolved width differs.
        admission_width: ["0", "16"]
    name: build-and-test (admission width ${{ matrix.admission_width }})
    env:
      KERNOVA_TEST_ADMISSION_WIDTH: ${{ matrix.admission_width }}
      TEST_RUNNER_KERNOVA_TEST_ADMISSION_WIDTH: ${{ matrix.admission_width }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          # Nested under DerivedData/Kernova to match the Makefile's canonical
          # layout (see below). The key's `spm2` segment marks that move: a
          # same-key cache saved at the old flat path would restore uselessly
          # and, existing, block a save at the new path.
          path: DerivedData/Kernova/SourcePackages
          key: ${{ runner.os }}-spm2-${{ env.XCODE_BUILD }}-${{ hashFiles('Kernova.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # These invocations mirror the Makefile's XCODEBUILD_FLAGS by hand.
      #
      # Debug signs ad-hoc (Config/Base.xcconfig's CODE_SIGN_IDENTITY = "-"),
      # which needs no identity or team, so it embeds the app's sandbox
      # entitlements and the TEST_HOST-hosted unit tests run sandboxed here
      # exactly as they do locally.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Kernova.xcodeproj \
            -scheme Kernova \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData/Kernova \
            -configuration Debug \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | if command -v xcbeautify &>/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      # SPIKE: the test host does not inherit this shell's environment, and the
      # app-hosted bundle is sandboxed, so the width is also dropped where each
      # host can read it: the sandboxed host's container, the unhosted bundles'
      # real home, and /tmp. TestAdmission logs which source won.
      - name: Publish admission width
        run: |
          width="${KERNOVA_TEST_ADMISSION_WIDTH}"
          name="kernova-test-admission-width"
          container="$HOME/Library/Containers/app.kernova/Data"
          mkdir -p "$container"
          for path in "/tmp/$name" "$HOME/$name" "$container/$name"; do
            printf '%s\n' "$width" > "$path" || echo "could not write $path"
          done
          ls -l "/tmp/$name" "$HOME/$name" "$container/$name" || true

      - name: Test without building
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Kernova.xcodeproj \
            -scheme Kernova \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData/Kernova \
            -configuration Debug \
            -resultBundlePath artifacts/TestResults.xcresult \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | if command -v xcbeautify &>/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      # SPIKE: `Logger` writes to the unified log, not to the test host's
      # stdout, so the arm's one-line self-report is only visible here. Each
      # test-host process emits exactly one line, so this also counts the hosts.
      - name: Report admission arm
        if: always()
        run: |
          log show \
            --predicate 'subsystem == "app.kernova" AND category == "TestAdmission"' \
            --last 45m --style compact || echo "log show unavailable"

      # Kernova.xctestplan runs with retryOnFailure (maximumTestRepetitions: 2):
      # it re-runs the whole bundle and lets a test that failed its first attempt
      # pass the job on a retry, silently masking the flake — a green run can hide
      # a ~35%-flaky test (which is exactly how #523 stayed green for a day). This
      # step reads the result bundle and warns on any test with a failed attempt,
      # so a passed-on-retry flake is visible instead of an invisible green. It is
      # visibility-only and never fails the job (retryOnFailure still guards merges).
      - name: Report flaky (retried) tests
        if: always()
        run: |
          bundle="artifacts/TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No test result bundle at $bundle — skipping flake report."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found — skipping flake report."
            exit 0
          fi
          # Each attempt is a "Repetition" node; a genuine flake failed at least
          # one Repetition but still passed overall (a bundle-wide retry marks
          # every passed test's repetitions "Passed", so this does not
          # false-positive on the other tests dragged through the retry). A test
          # that failed every repetition is broken, not flaky — it already fails
          # the job on its own via xcodebuild's exit code, so `result == "Passed"`
          # excludes it here to avoid mislabeling it as a mere flake. Dedup on
          # `.nodeIdentifier` (suite-qualified) rather than `.name` (bare display
          # name), since two unrelated suites can share a test's display name.
          if ! flaky="$(xcrun xcresulttool get test-results tests --path "$bundle" 2>&1 | jq -r '
                [ .. | objects
                  | select(.nodeType? == "Test Case" and .result == "Passed")
                  | select(any(.children[]?; .nodeType == "Repetition" and .result == "Failed"))
                  | (.nodeIdentifier // .name) ] | unique[]' 2>&1)"; then
            echo "Could not read/parse test results at $bundle — skipping flake report. Output: $flaky"
            exit 0
          fi
          if [ -z "$flaky" ]; then
            echo "No flaky (failed-then-retried) tests in this run."
            exit 0
          fi
          {
            echo "### ⚠️ Flaky tests (failed at least one attempt)"
            echo ""
            echo "Retried via \`retryOnFailure\`, so these may have passed the job on a later attempt. Investigate before they degrade further:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" || true
          while IFS= read -r name; do
            # GitHub's `::` workflow-command protocol requires literal `%` in the
            # message to be percent-encoded so it isn't misparsed as an escape.
            escaped="${name//%/%25}"
            echo "::warning title=Flaky test (failed then retried)::${escaped}"
            echo "- \`${name}\`" >> "$GITHUB_STEP_SUMMARY" || true
          done <<< "$flaky"

      # SPIKE: the per-arm distribution the experiment is measuring. Reads the
      # result bundle rather than the xcbeautify stream, which reports no
      # per-test duration under the github-actions renderer.
      - name: Test duration stats
        if: always()
        run: |
          bundle="artifacts/TestResults.xcresult"
          [ -d "$bundle" ] || { echo "No result bundle — skipping duration stats."; exit 0; }
          xcrun xcresulttool get test-results tests --path "$bundle" > /tmp/test-results.json 2>/dev/null \
            || { echo "Could not export test results."; exit 0; }
          python3 - <<'PY'
          import json
          import re

          with open("/tmp/test-results.json") as handle:
              doc = json.load(handle)


          def seconds(text):
              total = 0.0
              found = False
              for value, unit in re.findall(r"([0-9]*\.?[0-9]+)\s*(ms|m|s)", text):
                  found = True
                  scale = {"ms": 0.001, "s": 1.0, "m": 60.0}[unit]
                  total += float(value) * scale
              return total if found else None


          cases = []
          stack = list(doc.get("testNodes", []))
          while stack:
              node = stack.pop()
              if isinstance(node, dict):
                  if node.get("nodeType") == "Test Case":
                      duration = seconds(str(node.get("duration", "")))
                      if duration is not None:
                          cases.append((duration, node.get("nodeIdentifier") or node.get("name"), node.get("result")))
                  stack.extend(node.get("children", []) or [])

          if not cases:
              print("No per-test durations in the result bundle.")
              raise SystemExit(0)

          durations = sorted(d for d, _, _ in cases)
          count = len(durations)


          def quantile(fraction):
              index = min(count - 1, max(0, int(round(fraction * (count - 1)))))
              return durations[index]


          results = {}
          for _, _, result in cases:
              results[result] = results.get(result, 0) + 1

          print(f"ADMISSION-STATS cases={count} results={results}")
          print(f"ADMISSION-STATS total_test_seconds={sum(durations):.1f}")
          print(
              "ADMISSION-STATS "
              f"median={quantile(0.5):.3f} p90={quantile(0.90):.3f} "
              f"p95={quantile(0.95):.3f} p99={quantile(0.99):.3f} max={durations[-1]:.3f}"
          )
          for threshold in (1, 5, 10, 30, 55):
              over = sum(1 for d in durations if d >= threshold)
              print(f"ADMISSION-STATS over_{threshold}s={over}")
          print("ADMISSION-STATS slowest:")
          for duration, name, result in sorted(cases, key=lambda case: -case[0])[:15]:
              print(f"ADMISSION-SLOW {duration:9.3f}  {result}  {name}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-width-${{ matrix.admission_width }}
          # RATIONALE: upload the PARENT dir, not the `.xcresult` bundle directly.
          # upload-artifact roots the archive at the lowest common ancestor of the
          # matched files, so pointing it at the bundle drops the `.xcresult`
          # wrapper — the download then unpacks as a bare Info.plist + Data/ that
          # xcresulttool can't open without first renaming it back. Uploading the
          # enclosing `artifacts/` keeps `TestResults.xcresult/` intact in the
          # download (matching the `-resultBundlePath artifacts/TestResults.xcresult`
          # above), so `gh run download` yields a directly-usable result bundle.
          path: artifacts/
          retention-days: 7
