name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      # Debug signs ad-hoc (Config/Base.xcconfig's CODE_SIGN_IDENTITY = "-"),
      # which needs no identity or team, so it embeds the app's sandbox
      # entitlements and the TEST_HOST-hosted unit tests run sandboxed here
      # exactly as they do locally.
      # Raw xcodebuild output throughout this workflow, not xcbeautify: its
      # github-actions renderer condenses errors — on test failures it prints
      # the failing test names alone, dropping the `#expect` text and the
      # source line that say what actually failed.
      - name: Build for testing
        run: make build-for-testing 2>&1

      # The admission width caps concurrent test cases per host process (three
      # hosts run at once, so the machine-wide bound is 3×). It is a herd cap
      # sized for headroom as the suite grows, not a tuning knob: the suite
      # must stay green at any width, and a flake a width change surfaces gets
      # fixed or deleted (docs/TESTING.md, "Flaky tests"), never quieted by
      # re-tuning this number. Only the prefixed spelling reaches the test
      # hosts: `xcodebuild` forwards `TEST_RUNNER_`-prefixed variables to the
      # test runner with the prefix stripped and passes nothing else through,
      # so the plain name set here silently no-ops and the run measures
      # pass-through (observed 2026-08-20).
      #
      # `timeout-minutes` bounds this step rather than the job, so a stall fails
      # the step and the reporting steps below still run — the job cap instead
      # cancels the run outright, leaving the result bundle half-written and
      # nothing to read. It backs up the test plan's per-test timeouts, which
      # fail one stuck test and let the rest of the run finish, so it is sized
      # for a healthy run plus one test spending its whole allowance. A healthy step
      # takes about two minutes.
      - name: Test without building
        timeout-minutes: 10
        env:
          TEST_RUNNER_KERNOVA_TEST_ADMISSION_WIDTH: "32"
        run: make test-without-building 2>&1

      # Each test host's own stdout/stderr, which xcodebuild's stream does not
      # carry: a host that crashes or freezes says why only there.
      - name: Report test-host output
        if: failure()
        run: Tools/report-test-host-output.sh

      # xcodebuild's own stream interleaves parallel test hosts, so a failure's
      # message can land far from the test that raised it. This pairs each
      # failed case with every message it recorded, in one block.
      - name: Report failure messages
        if: always()
        run: |
          bundle="artifacts/TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "No test result bundle at $bundle — skipping failure report."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found — skipping failure report."
            exit 0
          fi
          # Keep stderr: a rejected flag or an unreadable bundle otherwise
          # degrades this step to a silent no-op with nothing to debug from.
          if ! error="$(xcrun xcresulttool get test-results tests --path "$bundle" --format json 2>&1 >/tmp/tests.json)"; then
            echo "Could not read test results at $bundle — skipping failure report. Output: $error"
            exit 0
          fi
          jq -r '
            [ .. | objects
              | select(.nodeType? == "Test Case" and .result == "Failed") ]
            | .[]
            | "=== " + (.nodeIdentifier // .name) + "\n"
              + ( [ .. | objects | select(.nodeType? == "Failure Message") | .name ]
                  | unique | join("\n") )
          ' /tmp/tests.json || echo "Could not parse test results — skipping failure report."

      # `TestAdmission` resolves its width once per test-host process and logs
      # the outcome through `Logger`, which writes to the unified log rather
      # than the runner's stdout — so this is the only place the resolved arm is
      # visible. Each test-host process emits exactly one line, so this also
      # counts the hosts the width had to reach. Without it a width that never
      # arrived is indistinguishable from one that did, and the run silently
      # measures pass-through.
      - name: Report admission arm
        if: always()
        run: |
          log show \
            --predicate 'subsystem == "app.kernova" AND category == "TestAdmission"' \
            --last 30m --style compact || echo "log show unavailable"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          # RATIONALE: upload the PARENT dir, not the `.xcresult` bundle directly.
          # upload-artifact roots the archive at the lowest common ancestor of the
          # matched files, so pointing it at the bundle drops the `.xcresult`
          # wrapper — the download then unpacks as a bare Info.plist + Data/ that
          # xcresulttool can't open without first renaming it back. Uploading the
          # enclosing `artifacts/` keeps `TestResults.xcresult/` intact in the
          # download (matching the Makefile's `RESULT_BUNDLE`), so `gh run
          # download` yields a directly-usable result bundle.
          path: artifacts/
          retention-days: 7
