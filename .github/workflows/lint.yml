name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Renaming this job means editing the "Required actions" ruleset in the same
  # change — docs/BUILD.md "CI".
  lint:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          # xcodebuild, not the linter itself: `swift-format --version` reports
          # the branch name `main`, which names no toolchain, while this records
          # the Xcode whose bundled rule set decides the run. It doubles as the
          # full-Xcode assert — Command Line Tools carries swift-format alone.
          xcodebuild -version

      # The macOS runner images ship shellcheck; install it only if a future
      # image drops it, so `make lint` never silently skips static analysis
      # here (it hard-fails on CI without it).
      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      - name: make lint (swift-format --strict + shell lint)
        run: make lint
