name: Lint

on:
  push:
    branches: [main]
  # A PR is linted only while it carries the `ci` label.
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci'))
    # Job-level, so a run whose job is skipped never cancels the real run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # The macOS runner images ship shellcheck; install it only if a future
      # image drops it, so `make lint` never silently skips static analysis
      # here (it hard-fails on CI without it).
      - name: Ensure shellcheck
        run: Tools/brew-install.sh shellcheck

      - name: make lint
        run: make lint
