name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Renaming this job means editing the "Required actions" ruleset in the same
  # change: the ruleset matches a required check by job name.
  lint:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # The macOS runner images ship shellcheck; install it only if a future
      # image drops it, so `make lint` never silently skips static analysis
      # here (it hard-fails on CI without it).
      - name: Ensure shellcheck
        run: Tools/brew-install.sh shellcheck

      - name: make lint
        run: make lint
