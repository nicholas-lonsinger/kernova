version: 2
updates:
  # "/" covers .github/workflows and a root action.yml; a composite action's
  # directory is scanned only when listed.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    labels:
      - "Area: Build & CI"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # No swift entry covers the Xcode workspace's Package.resolved: for a package
  # only a local package's manifest requires, Dependabot's Xcode mode takes the
  # newest tag whatever that manifest admits ("This may produce a pin that is
  # not resolvable", in dependabot-core's
  # swift/lib/dependabot/swift/update_checker/xcode_version_resolver.rb).
