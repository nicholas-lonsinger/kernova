# Periphery's analysis options for `make dead-code`; Tools/dead-code.sh names
# what each scan reads.
# https://github.com/peripheryapp/periphery

# `KernovaKit` is a closed monorepo package — every consumer lives in this
# repository, so an unused public declaration is dead code. A public symbol
# with a use outside the repo takes a per-symbol `// periphery:ignore`.
retain_public: false

# Keeps AppKit selectors, NSMenuItemValidation conformance, target/action
# wiring, and KVO observers from being flagged.
retain_objc_accessible: true

# Properties that are only assigned (never read) often back IBOutlets or
# observation tokens whose lifetime IS the value — flagging them is noisy.
retain_assign_only_properties: true

# Delegate-protocol methods follow the Cocoa convention of passing the
# sender back (`func tableView(_ tableView: NSTableView, …)`); conformers
# routinely don't use that argument. Retaining unused protocol-function
# parameters silences that noise while still flagging genuinely-dead
# parameters on non-protocol functions. (`@objc` action `sender` params
# aren't protocol funcs, so they are handled at the source: the unused
# binding is renamed to `_`.)
retain_unused_protocol_func_params: true

# The system runs each App Intent. Periphery 3.8.0 keeps only a type naming an
# App Intents protocol itself, not one conforming through `ConsentingIntent`,
# and `// periphery:ignore` on a type reports each of its members that code
# references as a superfluous ignore.
retain_files:
  - "KernovaCore/Sources/KernovaCore/Intents/*Intents.swift"

report_exclude:
  - "**/.build/**"
  - "DerivedData/**"
  # SwiftProtobuf-generated sources include unused symbols (e.g. the
  # `_GeneratedWithProtocGenSwiftVersion` version-check struct) that are
  # part of the generator's contract — not actionable findings.
  - "**/*.pb.swift"
  # Only the Linux agent uses these in production, and the scan builds for macOS: not scanned.
  - "KernovaKit/Sources/KernovaDBus/**"
  - "KernovaKit/Sources/KernovaLogging/StandardErrorLogDestination.swift"
